# Controlled benchmark: between runs only the model (with its tuned knob, learning rate and
# weight decay), the target mode and the seed change. Read by scripts/run_benchmark.py.
base: ../base.yaml

# Same budget for every model.
train:
  epochs: 150
  patience: 20

benchmark:
  models: [convlstm, unet, fno, swin, swin_unet, gnn, mamba]
  target_modes: [ox, species, multitask]
  seeds: [1, 2, 3]
  parameter_budget: [4.0e+6, 6.0e+6]   # 5M +/- 20%, checked before every run
  model_overrides:
    mamba: {backend: mamba_ssm}         # all Mamba numbers from the CUDA kernel
  tuning:                               # ox mode, validation Ox RMSE decides
    trials: 8
    seed: 0                             # trial i uses the same lr and weight decay for every model
    target_mode: ox
    lr: [1.0e-4, 3.0e-3]                # log-uniform
    weight_decay: [1.0e-6, 1.0e-3]      # log-uniform
