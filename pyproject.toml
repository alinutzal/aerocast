[project]
name = "aerocast"
version = "0.1.0"
description = "ConvLSTM air-quality (Ox = NO2 + O3) forecasting on CMAQ grids"
requires-python = ">=3.10"
dependencies = [
  "xarray>=2024.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "netCDF4>=1.6",
  "cftime>=1.6",
  "torch>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "tqdm>=4.65",
  "wandb>=0.17",
  "pyyaml>=6.0",
  "neuraloperator==2.0.0",
  "monai==1.6.1",
  "einops==0.8.2",
  "torch-geometric==2.8.0.post1",
  "mambapy==1.2.0",
  # CUDA selective-scan kernel for the Mamba model (Linux, CUDA 12, torch 2.9, Python 3.12).
  "mamba-ssm @ https://github.com/state-spaces/mamba/releases/download/v2.3.2.post1/mamba_ssm-2.3.2.post1+cu12torch2.9cxx11abiTRUE-cp312-cp312-linux_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
]

[project.scripts]
aerocast-train = "aerocast.train:main"
aerocast-evaluate = "aerocast.evaluate:main"

[project.optional-dependencies]
equates = [
    "cartopy>=0.25.0",
    "h5netcdf>=1.8.1",
    "kerchunk>=0.2.7",
    "numcodecs<0.13",
    "pyproj>=3.7.1",
    "s3fs==2024.9.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# aerocast only calls mamba-ssm's compiled scan kernel, so drop the dependencies its package
# pulls in for its language models and Mamba-3 kernels (a never-true marker removes them).
override-dependencies = [
  "tilelang ; sys_platform == 'never'",
  "apache-tvm-ffi ; sys_platform == 'never'",
  "quack-kernels ; sys_platform == 'never'",
  "transformers ; sys_platform == 'never'",
]

[tool.hatch.metadata]
allow-direct-references = true  # the pinned mamba-ssm wheel URL

[tool.hatch.build.targets.wheel]
packages = ["src/aerocast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: reads real remote/extracted data; excluded by default (deselect with '-m \"not slow\"' to run only the fast tests)",
]
