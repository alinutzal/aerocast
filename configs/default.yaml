# Baseline run: reproduces the original grid_forcast.py settings.
# Other configs can inherit from this one with `base: default.yaml`.
seed: null

data:
  meteo_path: datasets/METCRO2D_20181113.nc
  conc_path: datasets/out.combine_20181113.nc
  emis_path: datasets/egts_l.20181113.1.1km.baaqmd2018_newngc2.ncf
  # Quote names: unquoted NO would be parsed by YAML as boolean false
  predictor_vars: ["TEMP2", "WSPD10", "WDIR10", "NO", "NO2", "PM25_CL", "ALK1", "OLE1", "ARO1", "ARO2", "TERP", "ISOP"]
  target_no2: "NO2"
  target_o3: "O3"
  seq_len: 6        # input sequence length (past time steps)
  pred_len: 10      # future time steps to predict
  t_max: 50         # limit time steps (null = use all)
  normalization_mode: full   # none | predictors | full
  batch_size: 4
  shuffle: true

model:
  name: StackedConvLSTM
  hidden_dims: [64, 32]
  kernel_size: 3
  norm_type: batch  # gate normalization in ConvLSTM cells: batch | group
  num_groups: 8     # used when norm_type == group

train:
  epochs: 500
  patience: 30      # early stopping on training loss
  lr: 1.0e-3
  weight_decay: 1.0e-5
  grad_clip: 1.0
  log_every: 5
  scheduler:        # CosineAnnealingWarmRestarts
    T_0: 50
    T_mult: 2
    eta_min: 1.0e-6
  loss:
    type: mixed     # huber | mixed
    huber_beta: 0.5
    alpha: 0.7      # mixed = alpha * Huber + (1 - alpha) * MSE
  checkpoint: checkpoints/default.pt

eval:
  output_dir: results
  save_plots: true

wandb:
  enabled: false
  project: aerocast
  entity: null
  run_name: null
