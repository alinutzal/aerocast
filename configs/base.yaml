# AeroCast base configuration.
# Other configs inherit from it with `base: base.yaml` and override only what differs.
# `--model NAME` swaps in configs/models/NAME.yaml, and any value can be overridden, e.g.
#   uv run aerocast-train --config configs/smoke.yaml --model unet --set train.epochs=2
seed: 42
target_mode: ox             # ox | species | multitask

data:
  data_dir: datasets
  # One file of each kind per day; {date} is YYYYMMDD. Glob patterns are allowed.
  files:
    meteo: "METCRO2D_{date}.nc"
    conc: "out.combine_{date}.nc"
    emis: "egts_l.{date}.*.ncf"
  # Hours added to each file's TFLAG to get UTC. METCRO2D and emissions are stamped
  # 08Z-08Z (00-24 local standard time, PST = UTC-8). out.combine is stamped 00Z-23Z,
  # but its O3 and NO diurnal cycles show it holds 00-23 PST, so it is shifted by 8 h.
  # The loader keeps only hours present in all three files (24 per day when aligned).
  time_offset_hours: {meteo: 0, conc: 8, emis: 0}
  # Days to load. null = every day in data_dir that falls inside the split blocks.
  dates: null
  cache_dir: cache          # preprocessed arrays, so each NetCDF file is read once
  local_utc_offset_hours: -8  # local standard time (PST) for the hour-of-day channels
  # Channels are "source:VAR". Sources: meteo (METCRO2D), conc (out.combine), emis
  # (emissions), time (derived hour of day) and grid (derived coordinates). meteo:U10 and
  # meteo:V10 are derived from WSPD10 and WDIR10.
  inputs:
    # Past chemical state, hours t-6 .. t-1 (+ conc:O3 with features.include_o3_input).
    state: ["conc:NO", "conc:NO2", "conc:PM25_CL"]
    # Known drivers, hours t-6 .. t+9 with features.future_forcings.
    forcing: ["meteo:TEMP2", "meteo:WSPD10", "meteo:U10", "meteo:V10",
              "emis:NO", "emis:NO2", "emis:HONO",
              "emis:ALK1", "emis:OLE1", "emis:ARO1", "emis:ARO2", "emis:TERP", "emis:ISOP",
              "time:HOUR_SIN", "time:HOUR_COS"]
    static: ["grid:X", "grid:Y"]
  target: ["NO2", "O3"]     # species from out.combine; Ox = NO2 + O3
  seq_len: 6                # input hours
  pred_len: 10              # forecast lead hours
  normalization: full       # none | predictors | full (inputs and target)

features:
  include_o3_input: true    # add O3 to the past-state input channels
  future_forcings: true     # forcing covers the forecast hours; off, hour t-1 is repeated

split:
  mode: dates               # dates | smoke_test | legacy
  # Contiguous date blocks, inclusive, by file date: [start, end] or a list of them.
  # A window is kept only if all its input and target hours lie in one split.
  # PLACEHOLDERS: set these once more days arrive. With the single day available
  # now, use configs/smoke.yaml.
  train: ["2018-11-01", "2018-11-20"]
  val: ["2018-11-21", "2018-11-25"]
  test: ["2018-11-26", "2018-11-30"]

model:                      # replaced by --model configs/models/<name>.yaml
  name: convlstm
  hidden_dims: [64, 32]
  kernel_size: 3
  grad_checkpointing: false

train:
  batch_size: 4
  epochs: 500
  patience: 30              # early stopping on validation loss
  lr: 1.0e-3
  weight_decay: 1.0e-5
  grad_clip: 1.0
  scheduler: {T_0: 50, T_mult: 2, eta_min: 1.0e-6}  # CosineAnnealingWarmRestarts
  loss: {type: mixed, huber_beta: 0.5, alpha: 0.7}  # alpha * Huber + (1 - alpha) * MSE
  log_every: 5
  amp: none                 # none | bf16 (autocast)

output:
  runs_dir: runs            # one directory per run: config, git commit, stats, checkpoint
  results_csv: results/results.csv
  experiments_md: EXPERIMENTS.md   # one line per run
  note: ""                  # free text for EXPERIMENTS.md (aerocast-train --note)

logging:
  wandb: false
  wandb_project: aerocast
  wandb_entity: null
