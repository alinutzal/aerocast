[project]
name = "aerocast"
version = "0.1.0"
description = "ConvLSTM air-quality (Ox = NO2 + O3) forecasting on CMAQ grids"
requires-python = ">=3.10"
dependencies = [
  "xarray>=2024.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "netCDF4>=1.6",
  "cftime>=1.6",
  "torch>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "tqdm>=4.65",
  "wandb>=0.17",
  "pyyaml>=6.0",
  "neuraloperator==2.0.0",
]

[project.scripts]
aerocast-train = "aerocast.train:main"
aerocast-evaluate = "aerocast.evaluate:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerocast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
