# Plain 4-level 2D U-Net on the time-stacked input (every input hour stacked into channels).
model:
  name: unet
  width: 52                 # level widths 52-104-208-416
  levels: 4
  norm_groups: 4
  grad_checkpointing: false

train:
  amp: bf16

tuning:                     # random-search knob; every option stays within 5M +/- 20%
  knob: width
  options: [48, 52, 56]
