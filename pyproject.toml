[project]
name = "aerocast"
version = "0.1.0"
description = "AeroCast data reading and analysis utilities"
requires-python = ">=3.10"
dependencies = [
  "xarray>=2024.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "netCDF4>=1.6",
  "cftime>=1.6",
  "torch>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "tqdm>=4.65",
]

[tool.uv]
# Treat this repo as an application (not a package) to avoid building wheels
package = false
